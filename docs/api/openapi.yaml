openapi: 3.1.0
info:
  title: Sistema de Administración — Tienda de Cómputo API
  version: "1.0.0"
  description: >-
    API REST de gestión de inventario, órdenes de servicio, CRM, punto de venta,
    compras, finanzas, reportes y notificaciones. Reglas de negocio en
    docs/03-business-rules.md.

servers:
  - url: https://tienda.example.com/api/v1
    description: Producción
  - url: http://localhost:3000/api/v1
    description: Desarrollo

tags:
  - name: Auth
  - name: Productos
  - name: Catalogos
  - name: Clientes
  - name: Ordenes
  - name: Ventas
  - name: Compras
  - name: Finanzas
  - name: Notificaciones
  - name: Reportes
  - name: Auditoria

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, password]
              properties:
                usuario: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [token, refreshToken, usuario]
                    properties:
                      token: { type: string }
                      refreshToken: { type: string }
                      usuario:
                        $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar refresh token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Nuevos tokens emitidos (rotación)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [token, refreshToken]
                    properties:
                      token: { type: string }
                      refreshToken: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /productos:
    get:
      tags: [Productos]
      summary: Listar productos (paginado)
      operationId: listProductos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: q
          in: query
          description: Búsqueda por nombre/marca/modelo
          schema: { type: string }
        - name: catalogoId
          in: query
          description: Filtra por catálogo (incluye sus descendientes del árbol)
          schema: { type: integer }
        - name: tags
          in: query
          description: Filtra por tags/especificaciones
          schema: { type: string }
        - name: stockBajo
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Productos]
      summary: Crear producto
      operationId: createProducto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductoRequest"
      responses:
        "201":
          description: Producto creado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Producto" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  /productos/{productoId}:
    get:
      tags: [Productos]
      summary: Obtener producto
      operationId: getProducto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/productoId"
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Producto" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Productos]
      summary: Editar producto
      operationId: updateProducto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/productoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                categoriaId: { type: integer }
                nombre: { type: string }
                marca: { type: string }
                modelo: { type: string }
                precioCompra: { type: number }
                precioVenta: { type: number }
                stockMinimo: { type: integer }
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Producto" }
        "404":
          $ref: "#/components/responses/NotFound"

  /productos/{productoId}/ajustar:
    post:
      tags: [Productos]
      summary: Ajustar inventario (solo admin)
      operationId: ajustarProducto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/productoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cantidad, motivo]
              properties:
                cantidad: { type: integer, example: -3 }
                motivo: { type: string }
      responses:
        "200":
          description: Ajuste aplicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Movimiento" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /catalogos:
    get:
      tags: [Catalogos]
      summary: Árbol de catálogos (admin)
      operationId: listCatalogos
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Árbol jerárquico
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Catalogo" }
    post:
      tags: [Catalogos]
      summary: Crear nodo de catálogo (admin)
      operationId: createCatalogo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string }
                parentId: { type: [integer, "null"], description: "Máx 4 niveles" }
                tagsSugeridas:
                  type: array
                  items: { type: string }
                tagsCompatibilidad:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Nodo creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Catalogo" }
        "409":
          $ref: "#/components/responses/Conflict"

  /catalogos/{catalogoId}:
    put:
      tags: [Catalogos]
      summary: Editar nodo de catálogo (admin)
      operationId: updateCatalogo
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/catalogoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string }
                tagsSugeridas:
                  type: array
                  items: { type: string }
                tagsCompatibilidad:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Nodo actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Catalogo" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Catalogos]
      summary: Eliminar nodo de catálogo (admin, solo sin hijos ni productos)
      operationId: deleteCatalogo
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/catalogoId"
      responses:
        "200":
          description: Nodo eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "409":
          $ref: "#/components/responses/Conflict"

  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      operationId: listClientes
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: q
          in: query
          description: Búsqueda por nombre o teléfono
          schema: { type: string }
        - name: soloDeudores
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Cliente" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      tags: [Clientes]
      summary: Registrar cliente
      operationId: createCliente
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, telefono]
              properties:
                nombre: { type: string }
                telefono: { type: string }
                correo: { type: string, format: email }
                direccion: { type: string }
                preferenciaContacto:
                  type: string
                  enum: [whatsapp, correo, llamada]
                  default: whatsapp
                limiteCredito: { type: number, default: 3000, description: "Default $3,000 MXN, ampliable por cliente" }
                plazoCreditoDias: { type: integer, default: 15 }
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cliente" }
        "400":
          $ref: "#/components/responses/ValidationError"

  /ordenes:
    post:
      tags: [Ordenes]
      summary: Crear orden de servicio
      operationId: createOrden
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clienteId, tipoEquipo, fallaReportada]
              properties:
                clienteId: { type: integer }
                tipoEquipo:
                  type: string
                  enum: [laptop, desktop, all_in_one, periferico, componente, otro]
                marca: { type: string }
                modelo: { type: string }
                serie: { type: string }
                accesorios: { type: string }
                fallaReportada: { type: string }
                fechaPrometida: { type: string, format: date }
                tecnicoId: { type: integer }
      responses:
        "201":
          description: Orden creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OrdenServicio" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /ordenes/{ordenId}/estado:
    patch:
      tags: [Ordenes]
      summary: Cambiar estado de la orden (transición validada)
      operationId: cambiarEstadoOrden
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nuevoEstado]
              properties:
                nuevoEstado:
                  type: string
                  enum: [en_diagnostico, cotizado, en_reparacion, sustitucion_pendiente, listo, entregado, cancelado]
                nota: { type: string }
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OrdenServicio" }
        "409":
          description: Transición no permitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ordenes/{ordenId}/cotizaciones:
    post:
      tags: [Ordenes]
      summary: Generar cotización de servicio
      operationId: crearCotizacion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineas]
              properties:
                lineas:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [tipoLinea]
                    properties:
                      tipoLinea: { type: string, enum: [refaccion, mano_obra] }
                      productoId: { type: integer }
                      cantidad: { type: integer, minimum: 1 }
                      horas: { type: number }
                      tarifaHora: { type: number }
                      descripcion: { type: string }
      responses:
        "201":
          description: Cotización creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cotizacion" }
        "422":
          $ref: "#/components/responses/Unprocessable"

  /ordenes/{ordenId}/cotizaciones/{cotizacionId}/aprobar:
    post:
      tags: [Ordenes]
      summary: Aprobar cotización (reserva stock, notifica NOT-03)
      operationId: aprobarCotizacion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
        - $ref: "#/components/parameters/cotizacionId"
      responses:
        "200":
          description: Cotización aprobada y piezas reservadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cotizacion" }
        "422":
          description: Cotización expirada o stock insuficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ordenes/{ordenId}/sustituciones:
    post:
      tags: [Ordenes]
      summary: Proponer sustitución de pieza (técnico/admin, validación del cliente)
      operationId: crearSustitucion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineaId, productoId]
              properties:
                lineaId: { type: integer, description: "Línea de detalle_cotizacion sin stock suficiente" }
                productoId: { type: integer, description: "Sustituto sugerido con stock" }
                justificacion: { type: string }
      responses:
        "201":
          description: Sustitución propuesta; la orden pasa a sustitucion_pendiente (NOT-06)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Sustitucion" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Stock suficiente o sustituto sin stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Ordenes]
      summary: Listar sustituciones de una orden (técnico/admin)
      operationId: listarSustituciones
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
      responses:
        "200":
          description: Sustituciones de la orden
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Sustitucion" }

  /ordenes/{ordenId}/sustituciones/{sustitucionId}/aceptar:
    post:
      tags: [Ordenes]
      summary: Cliente aceptó la sustitución (reemplaza línea con precio del sustituto)
      operationId: aceptarSustitucion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
        - $ref: "#/components/parameters/sustitucionId"
      responses:
        "200":
          description: Línea reemplazada y totales recalculados; orden vuelve a su estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Sustitucion" }
        "409":
          $ref: "#/components/responses/Conflict"

  /ordenes/{ordenId}/sustituciones/{sustitucionId}/rechazar:
    post:
      tags: [Ordenes]
      summary: Cliente rechazó la sustitución (crea solicitud de reabastecimiento del original)
      operationId: rechazarSustitucion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
        - $ref: "#/components/parameters/sustitucionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        "200":
          description: Solicitud de reabastecimiento creada; orden vuelve a su estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Sustitucion" }
        "409":
          $ref: "#/components/responses/Conflict"

  /ordenes/{ordenId}/sustituciones/{sustitucionId}/cancelar:
    post:
      tags: [Ordenes]
      summary: Cancelar propuesta de sustitución (técnico/admin, con motivo)
      operationId: cancelarSustitucion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ordenId"
        - $ref: "#/components/parameters/sustitucionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        "200":
          description: Propuesta cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Sustitucion" }
        "409":
          $ref: "#/components/responses/Conflict"

  /ventas:
    post:
      tags: [Ventas]
      summary: Registrar venta (POS)
      operationId: createVenta
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVentaRequest"
      responses:
        "201":
          description: Venta registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Venta" }
        "422":
          $ref: "#/components/responses/Unprocessable"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ventas/{ventaId}/devolucion:
    post:
      tags: [Ventas]
      summary: Registrar devolución (15 días con ticket)
      operationId: crearDevolucion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ventaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineas]
              properties:
                lineas:
                  type: array
                  items:
                    type: object
                    required: [productoId, cantidad]
                    properties:
                      productoId: { type: integer }
                      cantidad: { type: integer, minimum: 1 }
                reembolsoMetodo: { type: string }
                notaCredito: { type: boolean, default: false }
      responses:
        "201":
          description: Devolución registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "422":
          description: Fuera de ventana o venta cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compras:
    post:
      tags: [Compras]
      summary: Crear orden de compra (admin)
      operationId: createCompra
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proveedorId, lineas]
              properties:
                proveedorId: { type: integer }
                lineas:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productoId, cantidad, precioUnitario]
                    properties:
                      productoId: { type: integer }
                      cantidad: { type: integer, minimum: 1 }
                      precioUnitario: { type: number }
      responses:
        "201":
          description: Compra creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"

  /compras/{compraId}/recibir:
    post:
      tags: [Compras]
      summary: Registrar entrada de mercancía (inventario += , CxP por lo recibido)
      description: >-
        Sin body (o sin `lineas`) recibe todo lo pendiente de la OC. Con `lineas` recibe por líneas
        (recepción parcial): la OC se mantiene en `enviada` con badge "Recepción parcial" hasta que
        todas las líneas estén completas → `recibida`. Sobrerecepción bloqueada (422 SOBRE_RECEPCION);
        líneas ajenas a la OC → 422 LINEA_NO_EN_COMPRA.
      operationId: recibirCompra
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/compraId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lineas:
                  type: array
                  items:
                    type: object
                    required: [detalleCompraId, cantidadRecibida]
                    properties:
                      detalleCompraId: { type: integer }
                      cantidadRecibida: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Mercancía recibida (CxP acumulada; solicitudes de la OC → entregada al completar la línea)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "422":
          description: Sobrerecepción o línea ajena a la OC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compras/reabastecimiento:
    get:
      tags: [Compras]
      summary: Sugerencias de reabastecimiento por proveedor (admin)
      operationId: sugerenciasReabastecimiento
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Grupos de sugerencias por proveedor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      grupos:
                        type: array
                        items:
                          type: object
                          properties:
                            proveedorId: { type: [integer, "null"] }
                            proveedorNombre: { type: [string, "null"] }
                            esFavorito: { type: boolean }
                            lineas:
                              type: array
                              items:
                                type: object
                                properties:
                                  productoId: { type: integer }
                                  sku: { type: string }
                                  nombre: { type: string }
                                  stock: { type: integer }
                                  sugerido: { type: integer }
                                  enOC: { type: boolean }
                                  folioOC: { type: [string, "null"] }
        "403":
          $ref: "#/components/responses/Forbidden"

  /compras/comparacion-precios:
    get:
      tags: [Compras]
      summary: Comparación de precios por proveedor para un producto (admin)
      description: >-
        Último precio por proveedor desde OCs enviadas/recibidas, ordenado asc; incluye el
        precio_compra actual del producto como referencia y flags (favorito, más barato,
        inactivo, por debajo del actual).
      operationId: comparacionPrecios
      security: [{ bearerAuth: [] }]
      parameters:
        - name: productoId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Comparativa de precios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      producto:
                        type: object
                        properties:
                          id: { type: integer }
                          sku: { type: string }
                          nombre: { type: string }
                          precioCompra: { type: number }
                          proveedorFavoritoId: { type: [integer, "null"] }
                      proveedores:
                        type: array
                        items:
                          type: object
                          properties:
                            proveedorId: { type: integer }
                            proveedorNombre: { type: string }
                            ultimoPrecio: { type: number }
                            ultimaFecha: { type: string, format: date }
                            folioOC: { type: string }
                            cantidad: { type: integer }
                            esFavorito: { type: boolean }
                            esInactivo: { type: boolean }
                            esMasBarato: { type: boolean }
                            porDebajoDelActual: { type: boolean }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /compras/solicitudes:
    post:
      tags: [Compras]
      summary: Crear solicitud de reabastecimiento (técnico/admin, solo si stock < cantidad)
      operationId: crearSolicitud
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productoId, cantidad]
              properties:
                productoId: { type: integer }
                cantidad: { type: integer, minimum: 1 }
                ordenId: { type: integer }
                motivo: { type: string }
      responses:
        "201":
          description: Solicitud creada (NOT-05 al admin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SolicitudReabastecimiento" }
        "422":
          description: Stock suficiente (STOCK_SUFICIENTE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Compras]
      summary: Listar solicitudes (admin; técnico requiere ordenId)
      operationId: listarSolicitudes
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: estado
          in: query
          schema: { type: string, enum: [pendiente, aprobada, entregada, rechazada, cancelada] }
        - name: ordenId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SolicitudReabastecimiento" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }

  /compras/solicitudes/aprobar:
    post:
      tags: [Compras]
      summary: Aprobar solicitudes y crear OC por proveedor (admin)
      operationId: aprobarSolicitudes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudes]
              properties:
                solicitudes:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: OCs creadas por proveedor
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      creadas:
                        type: array
                        items: { type: object }
                      yaNoPendientes:
                        type: array
                        items: { type: integer }

  /compras/solicitudes/{solicitudId}/rechazar:
    post:
      tags: [Compras]
      summary: Rechazar solicitud (admin, con motivo)
      operationId: rechazarSolicitud
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/solicitudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        "200":
          description: Solicitud rechazada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SolicitudReabastecimiento" }
        "409":
          $ref: "#/components/responses/Conflict"

  /compras/solicitudes/{solicitudId}/cancelar:
    post:
      tags: [Compras]
      summary: Cancelar solicitud pendiente (técnico autor o admin, con motivo)
      operationId: cancelarSolicitud
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/solicitudId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string }
      responses:
        "200":
          description: Solicitud cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SolicitudReabastecimiento" }
        "409":
          $ref: "#/components/responses/Conflict"

  /caja/abrir:
    post:
      tags: [Finanzas]
      summary: Abrir caja del día (vendedor/admin)
      operationId: abrirCaja
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Caja abierta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Caja" }
        "409":
          description: Ya existe caja abierta para el usuario/día
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /caja/cerrar:
    post:
      tags: [Finanzas]
      summary: Cerrar caja con arqueo (admin)
      operationId: cerrarCaja
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [efectivoFisico]
              properties:
                efectivoFisico: { type: number }
      responses:
        "200":
          description: Caja cerrada con diferencia calculada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Caja" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /reportes/ventas:
    get:
      tags: [Reportes]
      summary: Reporte de ventas (admin)
      operationId: reporteVentas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
        - name: grupo
          in: query
          schema: { type: string, enum: [dia, producto, vendedor] }
      responses:
        "200":
          description: Datos agregados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "403":
          $ref: "#/components/responses/Forbidden"

  /auditoria:
    get:
      tags: [Auditoria]
      summary: Bitácora de eventos críticos (admin)
      operationId: listAuditoria
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: accion
          in: query
          schema: { type: string }
        - name: entidad
          in: query
          schema: { type: string }
        - name: usuarioId
          in: query
          schema: { type: integer }
        - name: desde
          in: query
          schema: { type: string, format: date }
        - name: hasta
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Eventos paginados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditoriaEvento" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /usados:
    get:
      tags: [Productos]
      summary: Listar equipos usados (estado derivado del stock)
      operationId: listUsados
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: estado
          in: query
          schema: { type: string, enum: [disponible, vendido] }
        - name: origen
          in: query
          schema: { type: string, enum: [parte_de_pago, reparacion, otro] }
        - name: clienteId
          in: query
          schema: { type: integer }
        - name: q
          in: query
          description: Búsqueda por nombre o SKU
          schema: { type: string }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EquipoUsado" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
    post:
      tags: [Productos]
      summary: Registrar equipo usado (admin; crea producto bajo la raíz "Usado")
      operationId: createUsado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, nombre, valorTradeIn, precioVenta, origen]
              properties:
                sku: { type: string }
                nombre: { type: string }
                codigoBarras: { type: string }
                marca: { type: string }
                modelo: { type: string }
                valorTradeIn: { type: number, minimum: 0, description: "Costo de adquisición (precio_compra)" }
                precioVenta: { type: number, minimum: 0.01 }
                stock: { type: integer, minimum: 1, default: 1 }
                origen: { type: string, enum: [parte_de_pago, reparacion, otro], default: otro }
                clienteId: { type: integer }
                ordenId: { type: integer }
                observaciones: { type: string }
      responses:
        "201":
          description: Equipo usado registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EquipoUsado" }
        "422":
          description: No existe la categoría 'Usado' o cliente inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /usados/{usadoId}:
    put:
      tags: [Productos]
      summary: Editar equipo usado (admin)
      operationId: updateUsado
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/usadoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valorTradeIn: { type: number, minimum: 0 }
                precioVenta: { type: number, minimum: 0.01 }
                origen: { type: string, enum: [parte_de_pago, reparacion, otro] }
                observaciones: { type: [string, "null"] }
      responses:
        "200":
          description: Equipo usado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EquipoUsado" }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      description: Número de página (empieza en 1)
      schema: { type: integer, default: 1, minimum: 1 }
    pageSize:
      name: pageSize
      in: query
      description: Elementos por página (máx 100)
      schema: { type: integer, default: 20, maximum: 100 }
    productoId:
      name: productoId
      in: path
      required: true
      schema: { type: integer }
    catalogoId:
      name: catalogoId
      in: path
      required: true
      schema: { type: integer }
    ordenId:
      name: ordenId
      in: path
      required: true
      schema: { type: integer }
    cotizacionId:
      name: cotizacionId
      in: path
      required: true
      schema: { type: integer }
    sustitucionId:
      name: sustitucionId
      in: path
      required: true
      schema: { type: integer }
    usadoId:
      name: usadoId
      in: path
      required: true
      schema: { type: integer }
    solicitudId:
      name: solicitudId
      in: path
      required: true
      schema: { type: integer }
    compraId:
      name: compraId
      in: path
      required: true
      schema: { type: integer }
    ventaId:
      name: ventaId
      in: path
      required: true
      schema: { type: integer }

  schemas:
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        usuario: { type: string }
        rol: { type: string, enum: [admin, vendedor, tecnico] }
        isActive: { type: boolean }

    Producto:
      type: object
      properties:
        id: { type: integer }
        categoriaId: { type: integer, description: "Raíz del árbol de catálogos (categoría)" }
        catalogoId: { type: [integer, "null"], description: "Nodo hoja del catálogo" }
        sku: { type: string }
        codigoBarras: { type: [string, "null"] }
        nombre: { type: string }
        marca: { type: [string, "null"] }
        modelo: { type: [string, "null"] }
        precioCompra: { type: number }
        precioVenta: { type: number }
        stock: { type: integer }
        stockMinimo: { type: integer }
        stockMaximo: { type: integer, default: 0 }
        proveedorFavoritoId: { type: [integer, "null"] }
        especificaciones:
          type: array
          items: { type: string }
          description: Tags del producto (array de strings)
        isKit: { type: boolean }
        isActive: { type: boolean }

    CreateProductoRequest:
      type: object
      required: [categoriaId, sku, nombre, precioCompra, precioVenta]
      properties:
        categoriaId: { type: integer, description: "Debe ser un catálogo raíz" }
        catalogoId: { type: integer }
        sku: { type: string }
        codigoBarras: { type: string }
        nombre: { type: string }
        marca: { type: string }
        modelo: { type: string }
        precioCompra: { type: number, minimum: 0 }
        precioVenta: { type: number, minimum: 0 }
        stockMinimo: { type: integer, minimum: 0 }
        stockMaximo: { type: integer, minimum: 0 }
        proveedorFavoritoId: { type: integer }
        especificaciones:
          type: array
          items: { type: string }

    Catalogo:
      type: object
      properties:
        id: { type: integer }
        parentId: { type: [integer, "null"] }
        nombre: { type: string }
        tagsSugeridas:
          type: array
          items: { type: string }
        tagsCompatibilidad:
          type: array
          items: { type: string }
        hijos:
          type: array
          items: { $ref: "#/components/schemas/Catalogo" }

    ProductoListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Producto" }
        meta: { $ref: "#/components/schemas/PaginationMeta" }

    Cliente:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        telefono: { type: string }
        correo: { type: [string, "null"] }
        preferenciaContacto: { type: string, enum: [whatsapp, correo, llamada] }
        limiteCredito: { type: number, description: "Default $3,000 MXN al crear cliente" }
        plazoCreditoDias: { type: integer, default: 15 }
        etiquetas:
          type: array
          items: { type: string }
        saldoPendiente: { type: number, description: "Calculado: total − pagos" }

    OrdenServicio:
      type: object
      properties:
        id: { type: integer }
        folio: { type: string }
        clienteId: { type: integer }
        tipoEquipo: { type: string }
        marca: { type: [string, "null"] }
        modelo: { type: [string, "null"] }
        serie: { type: [string, "null"] }
        accesorios: { type: [string, "null"] }
        fallaReportada: { type: string }
        diagnostico: { type: [string, "null"] }
        estado:
          type: string
          enum: [pendiente, en_diagnostico, cotizado, en_reparacion, sustitucion_pendiente, listo, entregado, cancelado]
        retrasada: { type: boolean }
        fechaPrometida: { type: string, format: date }
        fechaEntrega: { type: [string, "null"], format: date }
        tecnicoId: { type: [integer, "null"] }
        firmaRecepcion: { type: [string, "null"], description: "PNG base64 (canvas táctil, SER-10)" }

    Cotizacion:
      type: object
      properties:
        id: { type: integer }
        folio: { type: string }
        ordenId: { type: integer }
        estado: { type: string, enum: [emitida, aprobada, rechazada, expirada, convertida] }
        subtotal: { type: number }
        iva: { type: number }
        total: { type: number }
        vigenciaDesde: { type: string, format: date }
        vigenciaHasta: { type: string, format: date }
        lineas:
          type: array
          items: { type: object }

    CreateVentaRequest:
      type: object
      required: [lineas, tipoPago]
      properties:
        clienteId: { type: integer }
        ordenId: { type: integer }
        lineas:
          type: array
          minItems: 1
          items:
            type: object
            required: [cantidad]
            properties:
              productoId: { type: integer }
              cantidad: { type: integer, minimum: 1 }
              precioNeto: { type: number }
              descripcionServicio: { type: string }
        descuento: { type: number, default: 0 }
        motivoDescuento: { type: string }
        tipoPago: { type: string, enum: [contado, credito] }
        metodoPago: { type: string, enum: [efectivo, tarjeta_credito, tarjeta_debito, transferencia, deposito] }
        plazoDias: { type: integer }
        montoRecibido: { type: number }

    Venta:
      type: object
      properties:
        id: { type: integer }
        folio: { type: string }
        clienteId: { type: [integer, "null"] }
        subtotal: { type: number }
        iva: { type: number }
        total: { type: number }
        descuento: { type: number }
        tipoPago: { type: string, enum: [contado, credito] }
        estado: { type: string, enum: [completada, cancelada, devuelta, credito_pendiente] }
        fechaVencimiento: { type: [string, "null"], format: date }
        lineas:
          type: array
          items: { type: object }

    Movimiento:
      type: object
      properties:
        id: { type: integer }
        productoId: { type: integer }
        tipo: { type: string }
        cantidad: { type: integer }
        referenciaTipo: { type: [string, "null"] }
        referenciaId: { type: [integer, "null"] }
        motivo: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    Caja:
      type: object
      properties:
        id: { type: integer }
        usuarioId: { type: integer }
        fecha: { type: string, format: date }
        estado: { type: string, enum: [abierta, cerrada, reabierta] }
        efectivoFisico: { type: [number, "null"] }
        diferencia: { type: [number, "null"] }
        apertura: { type: string, format: date-time }
        cierre: { type: [string, "null"], format: date-time }

    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    EquipoUsado:
      type: object
      properties:
        id: { type: integer }
        productoId: { type: integer }
        sku: { type: string }
        nombre: { type: string }
        marca: { type: [string, "null"] }
        modelo: { type: [string, "null"] }
        precioCompra: { type: number }
        precioVenta: { type: number }
        stock: { type: integer }
        estado: { type: string, enum: [disponible, vendido], description: "Derivado del stock" }
        clienteOrigenId: { type: [integer, "null"] }
        clienteOrigenNombre: { type: [string, "null"] }
        ordenId: { type: [integer, "null"] }
        valorTradeIn: { type: number }
        origen: { type: string, enum: [parte_de_pago, reparacion, otro] }
        observaciones: { type: [string, "null"] }
        creadoPorNombre: { type: string }
        createdAt: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }

    Sustitucion:
      type: object
      properties:
        id: { type: integer }
        ordenId: { type: integer }
        cotizacionId: { type: integer }
        cotizacionFolio: { type: string }
        lineaId: { type: integer }
        productoOriginalId: { type: integer }
        skuOriginal: { type: string }
        nombreOriginal: { type: string }
        cantidad: { type: integer }
        sustitutoId: { type: integer }
        skuSustituto: { type: string }
        nombreSustituto: { type: string }
        precioSustituto: { type: number }
        stockSustituto: { type: integer }
        justificacion: { type: [string, "null"] }
        clienteAcepta: { type: [boolean, "null"] }
        estado: { type: string, enum: [pendiente, aceptada, rechazada, cancelada] }
        solicitudId: { type: [integer, "null"] }
        creadaPor: { type: integer }
        creadorNombre: { type: string }
        createdAt: { type: string, format: date-time }
        resueltoAt: { type: [string, "null"], format: date-time }

    SolicitudReabastecimiento:
      type: object
      properties:
        id: { type: integer }
        productoId: { type: integer }
        sku: { type: string }
        productoNombre: { type: string }
        cantidad: { type: integer }
        ordenId: { type: [integer, "null"] }
        ordenFolio: { type: [string, "null"] }
        solicitadoPor: { type: integer }
        solicitanteNombre: { type: string }
        motivo: { type: [string, "null"] }
        estado: { type: string, enum: [pendiente, aprobada, entregada, rechazada, cancelada] }
        rechazoMotivo: { type: [string, "null"] }
        compraId: { type: [integer, "null"] }
        compraFolio: { type: [string, "null"] }
        resueltoPor: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
        resueltoAt: { type: [string, "null"], format: date-time }

    AuditoriaEvento:
      type: object
      properties:
        id: { type: integer }
        usuarioId: { type: integer }
        usuarioNombre: { type: string }
        accion: { type: string }
        entidad: { type: string }
        entidadId: { type: [integer, "null"] }
        antes: { type: [object, "null"] }
        despues: { type: [object, "null"] }
        fecha: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Sin permisos para la acción
